<style>
:root{--bg:#f4f7ff;--panel:#ffffff;--panel2:#f6f8fe;--line:#e2e8f5;--gold:#f0b429;--gold2:#d99a0b;--goldt:#a86a00;--txt:#1b2240;--mut:#6a7597;--ok:#10a36a;--bad:#e5484d;--blue:#4f7cff}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Cairo',Tahoma,sans-serif;background:radial-gradient(900px 500px at 90% -10%,#ffe9a8aa,transparent 70%),radial-gradient(800px 500px at 0% 0%,#cfe0ffcc,transparent 70%),radial-gradient(700px 500px at 50% 110%,#d8f5e6aa,transparent 70%),var(--bg);background-attachment:fixed;color:var(--txt);min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.num{font-family:'Montserrat','Cairo',sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:20px 18px 60px}
.narrow{max-width:440px}
h1{font-size:1.3rem;margin:6px 0 2px;font-weight:900}h2{font-size:1.05rem;margin:0 0 14px;font-weight:800}
.sub{color:var(--mut);font-size:.92rem;margin:0 0 16px;line-height:1.7}
.box{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 8px 28px rgba(60,80,140,.08);min-width:0}
input,select,textarea{width:100%;padding:13px 14px;margin:0 0 10px;border-radius:12px;border:1.5px solid var(--line);background:#edf1fb;color:var(--txt);font:700 16px 'Cairo',sans-serif}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--goldt)}
label{display:block;font-size:.82rem;color:var(--mut);margin:0 2px 5px;font-weight:700}
.btn{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(180deg,#f9d25c,var(--gold2));color:#2a1c00;font:900 16px 'Cairo',sans-serif;cursor:pointer}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--txt)}.btn:disabled{opacity:.55}
.msg{min-height:1.3em;color:var(--bad);font-weight:700;font-size:.92rem;text-align:center;margin:4px 0 10px;white-space:pre-line}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;font:700 .9rem 'Cairo';cursor:pointer;display:block;margin:10px auto 0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* top bar */
.bar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .bar .lg{width:44px;height:44px;border-radius:50%;background:#fff center/contain no-repeat;background-origin:content-box;padding:3px;border:2px solid var(--gold);flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;color:#0b0f1f}
.bar b{font-size:1.05rem;flex:1}.ib{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:9px 14px;font:700 .85rem 'Cairo';cursor:pointer}
/* hero */
.hero{display:flex;align-items:center;gap:22px;padding:26px;border-radius:26px;background:linear-gradient(135deg,#fff4cf,#ffffff 55%,#dfe9ff);border:1.5px solid #f3d98a;box-shadow:0 10px 30px rgba(200,150,20,.15);margin-bottom:18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:-60% auto auto -10%;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,60,.35),transparent 65%);pointer-events:none}
.avatar{width:112px;height:112px;border-radius:30px;flex:none;border:3px solid var(--gold);background:#edf1fb center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:2.6rem;font-weight:900;color:var(--goldt);cursor:pointer;position:relative;padding:0}
.avatar i{position:absolute;bottom:-8px;left:-8px;width:34px;height:34px;border-radius:50%;background:var(--gold);color:#2a1c00;font-style:normal;font-size:1rem;display:flex;align-items:center;justify-content:center;border:3px solid #fff}
.hero .hi{color:var(--mut);font-size:.95rem}.hero .nm{font-size:1.9rem;font-weight:900;line-height:1.25;margin:2px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:5px 13px;border-radius:30px;font-weight:800;font-size:.82rem;border:1px solid var(--line);background:#fff}
.chip.ok{color:var(--ok);border-color:var(--ok);background:rgba(16,163,106,.1)}.chip.bad{color:var(--bad);border-color:var(--bad);background:rgba(255,107,107,.12)}.chip.warn{color:var(--goldt);border-color:var(--goldt);background:rgba(242,193,78,.12)}
/* grid */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.s12{grid-column:span 12}.s7{grid-column:span 7}.s5{grid-column:span 5}.s6{grid-column:span 6}.s4{grid-column:span 4}
@media(max-width:820px){.s7,.s5,.s6,.s4{grid-column:span 12}.hero{flex-direction:column;text-align:center;padding:22px 16px}.chips{justify-content:center}.hero .nm{font-size:1.55rem}}
.cardimg{display:block;width:100%;height:auto;border-radius:22px;box-shadow:0 14px 34px rgba(30,40,90,.28);max-width:460px;margin:0 auto;background:#edf1fb;aspect-ratio:1012/638}
.flip{perspective:1400px;max-width:460px;margin:0 auto;aspect-ratio:1012/638;cursor:pointer;-webkit-tap-highlight-color:transparent}
.fi{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;max-width:none;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .bk{transform:rotateY(180deg)}
@media(prefers-reduced-motion:reduce){.fi{transition:none}}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tools button{flex:1;min-width:120px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}.seg button{background:transparent;border:0;color:var(--mut);padding:9px 16px;font:800 .85rem 'Cairo';cursor:pointer}.seg button.on{background:var(--gold);color:#2a1c00}
.ringbox{display:flex;align-items:center;gap:18px}.ring{width:132px;height:132px;flex:none;position:relative}.ring svg{transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring b{font-size:2rem;line-height:1}.ring small{color:var(--mut);font-size:.75rem}
.kv{display:grid;gap:0}.kv div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:.92rem}.kv div:last-child{border:0}.kv span{color:var(--mut)}.kv b{text-align:left}
.stat{text-align:center;padding:18px 10px}.stat b{display:block;font-size:1.7rem;color:var(--goldt)}.stat small{color:var(--mut);font-size:.8rem}
.bartrack{height:12px;border-radius:12px;background:#edf1fb;overflow:hidden;margin:10px 0 8px}.bartrack i{display:block;height:100%;border-radius:12px;background:linear-gradient(90deg,var(--gold2),#f9d25c)}
.alert{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:16px 20px;border-radius:18px;margin-bottom:16px;font-weight:700}
.alert.warn{background:rgba(242,193,78,.12);border:1px solid var(--gold)}.alert.bad{background:rgba(255,107,107,.1);border:1px solid var(--bad)}.alert button{width:auto;padding:10px 22px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:560px){.acts{grid-template-columns:1fr 1fr}}
.act{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:18px 8px;text-align:center;color:var(--txt);font:800 .95rem 'Cairo';cursor:pointer;transition:border-color .15s}.act:hover{border-color:var(--goldt)}
.act span{display:block;font-size:1.7rem;margin-bottom:4px}
.hist{font-size:.9rem;border-bottom:1px dashed var(--line);padding:11px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}.hist:last-child{border:0}.hist small{color:var(--mut);display:block}
.pill{padding:3px 12px;border-radius:20px;font-size:.76rem;font-weight:800;white-space:nowrap}.pill.pending{background:rgba(242,193,78,.15);color:var(--goldt)}.pill.approved{background:rgba(62,207,142,.15);color:var(--ok)}.pill.rejected{background:rgba(255,107,107,.13);color:var(--bad)}
.tip{display:flex;gap:14px;align-items:flex-start;line-height:1.8}.tip span{font-size:2rem}
.ov{position:fixed;inset:0;background:rgba(30,40,80,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--panel);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0));max-height:92vh;overflow:auto}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:22px}}
/* cropper */
.crop{width:280px;height:280px;margin:6px auto 14px;border-radius:30px;overflow:hidden;position:relative;background:#edf1fb;border:3px solid var(--gold);touch-action:none;cursor:grab}
.crop img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;user-select:none;-webkit-user-drag:none;pointer-events:none}
.zoomrow{display:flex;align-items:center;gap:10px;margin-bottom:14px}.zoomrow button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--txt);font:900 1.3rem 'Cairo';cursor:pointer}
.zoomrow input{margin:0;padding:0;accent-color:#f2c14e;border:0;background:none}
.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--goldt);border-radius:50%;animation:s 1s linear infinite;margin:30vh auto}@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.mot{margin:6px 0 10px;color:var(--mut);font-weight:700;font-size:.95rem;line-height:1.7}
.pbar{display:grid;grid-template-columns:repeat(auto-fill,minmax(13px,1fr));gap:4px;margin:14px 0 10px;direction:ltr}.pbar i{height:16px;border-radius:5px;background:#edf1fb}.pbar i.d{background:linear-gradient(180deg,#f9d25c,var(--gold2))}.pbar i.t{background:var(--ok);box-shadow:0 0 0 3px rgba(16,163,106,.2)}
.plbl{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;color:var(--mut);font-weight:700;flex-wrap:wrap}.plbl b{color:var(--txt)}
.rnw{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--panel2);border:1px dashed var(--gold2);font-weight:800;font-size:.92rem;line-height:1.7}
.bdg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.bd{text-align:center;padding:12px 6px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);font-weight:800;font-size:.8rem}.bd span{display:block;font-size:1.7rem;margin-bottom:2px}.bd.off{opacity:.38;filter:grayscale(1)}.bd small{display:block;color:var(--mut);font-weight:600;font-size:.7rem}
.tip2{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:18px;background:linear-gradient(135deg,rgba(249,210,92,.22),rgba(79,124,255,.1));border:1px solid var(--line)}.tip2 em{font-style:normal;font-size:2rem}.tip2 div{line-height:1.9;font-weight:700}.tip2 small{display:block;color:var(--mut);font-weight:700;font-size:.74rem}
.ct a.btn{display:block;text-align:center;text-decoration:none;margin-top:10px}
.cnt{margin:0 0 14px;padding:10px 14px;border-radius:14px;background:var(--panel2);font-weight:800;text-align:center}

/* ===== موبايل أولاً ===== */
html{-webkit-text-size-adjust:100%}body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain;padding-top:env(safe-area-inset-top,0)}
button{touch-action:manipulation}.btn,.act,.ib{min-height:46px}
@media(max-width:600px){
.wrap{padding:12px 12px calc(36px + env(safe-area-inset-bottom,0))}
.box{padding:16px;border-radius:20px}
.grid{gap:12px}
.bar{margin-bottom:12px}.bar .ib{padding:8px 11px;font-size:.78rem}
.hero{padding:18px 14px;gap:12px;border-radius:22px;margin-bottom:12px}
.avatar{width:96px;height:96px;border-radius:26px}
.hero .nm{font-size:1.4rem;margin-bottom:8px}
.tools{gap:8px}.tools button{min-width:0;flex:1 1 calc(50% - 8px);padding:12px 8px;font-size:.9rem}
.ringbox{gap:12px}.ring{width:112px;height:112px}.ring svg{width:112px;height:112px}
.kv div{font-size:.88rem}.acts{gap:10px}.act{padding:14px 6px;font-size:.88rem}
.alert{padding:12px 14px;font-size:.9rem}.alert button{width:100%}
.sheet{padding:18px 14px calc(18px + env(safe-area-inset-bottom,0))}
h1{font-size:1.15rem}
}
/* ===== رسالة الصورة + التنبيه ===== */
.nudge{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;max-width:440px;margin:0 auto;z-index:8;display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:20px;background:#fff;border:1.5px solid var(--gold);box-shadow:0 14px 36px rgba(60,80,140,.22);transform:translateY(-130%);opacity:0;transition:transform .5s cubic-bezier(.2,.9,.3,1.2),opacity .4s}
.nudge.on{transform:none;opacity:1}
.nudge .ni{flex:none;width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#fff4cf,#f9d25c);display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.nudge div{flex:1;min-width:0;line-height:1.5}.nudge b{display:block;font-size:.95rem;font-weight:900}.nudge small{display:block;color:var(--mut);font-size:.76rem;font-weight:700}
.nudge button{flex:none;border:0;border-radius:12px;padding:9px 14px;background:linear-gradient(180deg,#f9d25c,var(--gold2));color:#2a1c00;font:900 .85rem 'Cairo',sans-serif;cursor:pointer}
.nudge u{flex:none;text-decoration:none;color:var(--mut);font-size:1.3rem;line-height:1;padding:4px 2px;cursor:pointer}
.avatar.pulse{animation:pl 1.8s ease-out infinite}@keyframes pl{0%{box-shadow:0 0 0 0 rgba(240,180,41,.55)}100%{box-shadow:0 0 0 18px rgba(240,180,41,0)}}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:99998;background:#1b2240;color:#fff;padding:11px 20px;border-radius:30px;font:800 .9rem 'Cairo',sans-serif;opacity:0;transition:.35s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.avatar.pulse{animation:none}.nudge{transition:opacity .2s}}
</style>
<style>
.qrq{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}

<style>
.qnote{background:#fff4d6;border:1.5px solid var(--gold);color:#6b4600;border-radius:12px;padding:9px 12px;font-weight:800;font-size:.9rem;line-height:1.7;margin:0 0 10px}

      if (kind === 'complaint' && !note) { m.textContent = 'اكتب الشكوى.'; return; }
      if (kind === 'renewal' && !(f2.files && f2.files[0])) { m.textContent = 'ارفع صورة التحويل.'; return; }
      ok.disabled = true; m.textContent = '';
      (kind === 'renewal' ? compress(f2.files[0], 1100, .6) : Promise.resolve('')).then(function (p) { return rpc('portal_request', { p_token: token, p_kind: kind, p_note: note, p_proof: p }); }).then(function (r) {
        if (r.ok) { ov.remove(); load(); } else { ok.disabled = false; m.textContent = err(r); }
      }, function () { ok.disabled = false; m.textContent = 'مشكلة في الصورة، جرّب صورة تانية.'; });
    };
  }

  setInterval(function () { if (token && me && !document.hidden && !document.querySelector('.ov')) load(); }, 20000);
  window.addEventListener('online', function () { if (token && me && !document.querySelector('.ov')) load(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && token && me && !document.querySelector('.ov')) load(); });
  setTimeout(function () { if (app.querySelector('.spin')) retryView('التحميل واخد وقت'); }, 25000);
  if (!slug) { app.innerHTML = '<h1>الرابط ناقص</h1><p class="sub">اطلب من الجيم رابط البوابة الصحيح.</p>'; return; }
  var snap0 = readSnap(), tk0 = sget(TK);
  if (snap0 && tk0 && !navigator.onLine) { goOffline(snap0); return; }
  rpc('portal_gym', { p_slug: slug }, snap0 ? 1 : undefined, snap0 ? 4500 : undefined).then(function (g) {
    if (g.error === 'net') { if (snap0 && tk0) { goOffline(snap0); return; } retryView(); return; }
    if (g.error) { app.innerHTML = '<h1>الجيم غير متاح</h1><p class="sub">' + esc(err(g)) + '</p>'; return; }
    gymName = g.name; gymLogo = g.logo || ''; token = sget(TK);
    window.__mpInfo = { gym: gymName, logo: gymLogo, name: '' }; try { window.dispatchEvent(new Event('mpinfo')); } catch (e) {}
    var km = (location.hash || '').match(/[#&]k=([0-9a-f]{32,64})/i);
    if (km) {
      var key0 = km[1].toLowerCase();
      rpc('portal_magic', { p_slug: slug, p_key: key0 }, 2).then(function (r) {
        if (r.token) { token = r.token; sset(TK, token); sset('mp_key_' + slug, key0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} load(); }
        else if (r.error === 'net') { if (token) load(); else if (snap0 && tk0) goOffline(snap0); else retryView('مفيش اتصال بالإنترنت دلوقتي'); }   // اللينك سليم، النت بس هو المشكلة: نسيب اللينك في العنوان ونعيد المحاولة
        else if (token) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} load(); }
        else authView('اللينك ده مش متعرّف عندنا دلوقتي (ممكن رقمك اتغيّر في الجيم أو بياناتك اتعدّلت). ادخل برقم موبايلك وكودك، أو اطلب لينك جديد من الجيم.');
      });
      return;
    }
    if (token) load(); else authView();
  }).catch(function () { if (snap0 && tk0) goOffline(snap0); else retryView(); });
})();
</script>
<script>
/* ===== PWA: تثبيت البرنامج بلوجو ولون الكابتن ===== */
(function () {
  'use strict';
  function mpInfo() { return window.__mpInfo || {}; }
  function mpLogo() { return mpInfo().logo || ''; }
  function mpName() { return (mpInfo().name || mpInfo().gym || 'عضو').trim(); }
  var SLUG = (new URLSearchParams(location.search).get('g') || 'x');
  var LS_LOGO = 'gym_pro_logo_image', LS_NAME = 'gym_pro_app_name', LS_DISMISS = 'gm_pwa_dismiss';
  var deferred = null, lastKey = '', manifestURL = null, building = false;

  function ls(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function isStandalone() {
    return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  }
  function isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream; }
  function hex(r, g, b) { return '#' + [r, g, b].map(function (v) { return ('0' + Math.round(v).toString(16)).slice(-2); }).join(''); }
  function lum(r, g, b) { return .2126 * r + .7152 * g + .0722 * b; }

  /* تحليل ألوان اللوجو: لون الحواف + اللون الغالب (الأكثر حيوية) */
  function analyze(img) {
    var W = 64, c = document.createElement('canvas'); c.width = W; c.height = W;
    var x = c.getContext('2d', { willReadFrequently: true });
    var s = Math.min(W / img.width, W / img.height), w = img.width * s, h = img.height * s;
    x.drawImage(img, (W - w) / 2, (W - h) / 2, w, h);
    var d = x.getImageData(0, 0, W, W).data, buckets = {}, er = 0, eg = 0, eb = 0, ea = 0, en = 0, i, j, k;
    for (i = 0; i < W; i++) for (j = 0; j < W; j++) {
      k = (i * W + j) * 4;
      var r = d[k], g = d[k + 1], b = d[k + 2], a = d[k + 3];
      if (i < 2 || j < 2 || i > W - 3 || j > W - 3) { en++; ea += a; er += r; eg += g; eb += b; }
      if (a < 200) continue;
      var mx = Math.max(r, g, b), mn = Math.min(r, g, b), sat = mx ? (mx - mn) / mx : 0;
      var key = (r >> 5) + ',' + (g >> 5) + ',' + (b >> 5);
      var bk = buckets[key] || (buckets[key] = { n: 0, r: 0, g: 0, b: 0, sat: 0 });
      bk.n++; bk.r += r; bk.g += g; bk.b += b; bk.sat += sat;
    }
    var best = null, score = -1, any = null, anyN = 0;
    Object.keys(buckets).forEach(function (kk) {
      var o = buckets[kk], avgSat = o.sat / o.n, l = lum(o.r / o.n, o.g / o.n, o.b / o.n);
      if (o.n > anyN) { anyN = o.n; any = o; }
      if (l > 235 || l < 25) return;                 // تجاهل الأبيض والأسود الصريحين
      var sc = o.n * (0.35 + avgSat * 1.6);           // فضّل الألوان الحيوية
      if (sc > score) { score = sc; best = o; }
    });
    var dom = best || any || { n: 1, r: 0, g: 102, b: 255 };
    var res = { dom: [dom.r / dom.n, dom.g / dom.n, dom.b / dom.n], edge: null };
    if (en && ea / en > 240) {
      var avg = [er / en, eg / en, eb / en], spread = 0;
      for (i = 0; i < W; i++) for (j = 0; j < W; j++) if (i < 2 || j < 2 || i > W - 3 || j > W - 3) {
        k = (i * W + j) * 4;
        spread = Math.max(spread, Math.abs(d[k] - avg[0]), Math.abs(d[k + 1] - avg[1]), Math.abs(d[k + 2] - avg[2]));
      }
      res.edge = avg; res.spread = spread;           // لوجو بخلفية (نستخدم متوسط لون الحواف)
    }
    return res;
  }

  /* رسم أيقونة مربعة */
  function drawIcon(img, size, bg, scale) {
    var c = document.createElement('canvas'); c.width = c.height = size;
    var x = c.getContext('2d');
    x.fillStyle = bg; x.fillRect(0, 0, size, size);
    var box = size * scale, s = Math.min(box / img.width, box / img.height);
    var w = img.width * s, h = img.height * s;
    x.imageSmoothingQuality = 'high';
    x.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
    return c.toDataURL('image/png');
  }
  function drawFallback(size, bg, letter) {
    var c = document.createElement('canvas'); c.width = c.height = size;
    var x = c.getContext('2d'); x.fillStyle = bg; x.fillRect(0, 0, size, size);
    x.fillStyle = '#fff'; x.font = '900 ' + Math.round(size * .55) + 'px Cairo, Arial, sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(letter, size / 2, size / 2 + size * .04);
    return c.toDataURL('image/png');
  }

  function setLink(rel, attrs) {
    var el = document.querySelector('link[rel="' + rel + '"]' + (attrs.sizes ? '[sizes="' + attrs.sizes + '"]' : ''));
    if (!el) { el = document.createElement('link'); el.rel = rel; document.head.appendChild(el); }
    Object.keys(attrs).forEach(function (k) { el.setAttribute(k, attrs[k]); });
  }
  function setMeta(name, content) {
    var el = document.querySelector('meta[name="' + name + '"]');
    if (!el) { el = document.createElement('meta'); el.name = name; document.head.appendChild(el); }
    el.content = content;
  }

  /* خلفية البرنامج كله بلون خلفية اللوجو */
  function applyBrand(bgHex) {
    var root = document.documentElement, st = root.style;
    var r = parseInt(bgHex.substr(1, 2), 16), g = parseInt(bgHex.substr(3, 2), 16), b = parseInt(bgHex.substr(5, 2), 16);
    var dark = lum(r, g, b) < 140;
    st.setProperty('--lg-bg', bgHex);
    st.setProperty('--lg-fg', dark ? '#ffffff' : '#12151f');
    st.setProperty('--lg-fg2', dark ? 'rgba(255,255,255,.74)' : 'rgba(18,21,31,.68)');
    st.setProperty('--lg-chip', dark ? 'rgba(255,255,255,.12)' : 'rgba(18,21,31,.08)');
    st.setProperty('--lg-line', dark ? 'rgba(255,255,255,.18)' : 'rgba(18,21,31,.16)');
    root.classList.add('lg-tone', 'lg-custom');
    window.__gmBrand = 1;
  }

  function publish(name, icons, theme, bg) {
    var base = location.origin + location.pathname.replace(/[^\/]*$/, ''), me = location.origin + location.pathname + '?g=' + encodeURIComponent(SLUG);
    var manifest = {
      id: me, name: name, short_name: name.length > 14 ? name.slice(0, 14) : name,
      description: 'بوابة المشترك — ' + (mpInfo().gym || ''),
      start_url: me, scope: base,
      display: 'standalone', orientation: 'any', dir: 'rtl', lang: 'ar',
      theme_color: theme, background_color: bg,
      icons: [
        { src: icons.i192, sizes: '192x192', type: 'image/png', purpose: 'any' },
        { src: icons.i512, sizes: '512x512', type: 'image/png', purpose: 'any' },
        { src: icons.m512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
      ]
    };
    var blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    var url = URL.createObjectURL(blob);
    setLink('manifest', { href: url });
    if (manifestURL) URL.revokeObjectURL(manifestURL);
    manifestURL = url;
    setLink('icon', { href: icons.i192, type: 'image/png' });
    setLink('apple-touch-icon', { href: icons.a180 });
    setMeta('theme-color', theme);
    setMeta('apple-mobile-web-app-capable', 'yes');
    setMeta('mobile-web-app-capable', 'yes');
    setMeta('apple-mobile-web-app-title', name);
    setMeta('apple-mobile-web-app-status-bar-style', 'black-translucent');
    paintCard();
  }

  function build() {
    if (building) return;
    var photo = mpInfo().photo || '', src = photo || mpLogo(), name = mpName();
    var key = src.length + ':' + src.slice(-40) + '|' + name;
    if (key === lastKey) return;
    lastKey = key; building = true;
    if (!src) { window.__gmBrand = 0;                    // مفيش لوجو → أيقونة بحرف الاسم وبلون الثيم
      var pc = '#f0b429';
      var L = ((mpInfo().gym || name).trim().charAt(0) || 'G').toUpperCase();
      publish(name, { i192: drawFallback(192, pc, L), i512: drawFallback(512, pc, L), m512: drawFallback(512, pc, L), a180: drawFallback(180, pc, L) }, pc, pc);
      building = false; return;
    }
    var img = new Image();
    img.onload = function () {
      try {
        var a = analyze(img), dom = a.dom, theme = hex(dom[0], dom[1], dom[2]), bg;
        if (a.edge) bg = hex(a.edge[0], a.edge[1], a.edge[2]);          // نفس خلفية اللوجو
        else bg = lum(dom[0], dom[1], dom[2]) > 150 ? '#14161c' : '#ffffff'; // تباين مع لون اللوجو
        if (photo) {
          bg = theme;
          publish(name, { i192: drawIcon(img, 192, bg, 1), i512: drawIcon(img, 512, bg, 1), m512: drawIcon(img, 512, bg, .78), a180: drawIcon(img, 180, bg, 1) }, theme, bg);
          building = false; return;
        }
        var themeBar = a.edge ? bg : theme;
        publish(name, {
          i192: drawIcon(img, 192, bg, .82), i512: drawIcon(img, 512, bg, .82),
          m512: drawIcon(img, 512, bg, .60), a180: drawIcon(img, 180, bg, .82)
        }, themeBar, bg);
      } catch (e) { console.warn('pwa icon failed', e); }
      building = false;
    };
    img.onerror = function () { building = false; };
    if (src.indexOf('data:') !== 0) img.crossOrigin = 'anonymous';
    img.src = src;
  }

  /* كارت التثبيت في نص الشاشة */
  var LS_INST = 'gmm_inst_' + SLUG, LS_NEXT = 'gmm_next_' + SLUG, LS_N = 'gmm_n_' + SLUG;
  var DELAYS = [2, 5, 10, 30];                      // أيام الانتظار بعد كل رفض: يومين ثم 5 ثم 10 ثم شهر
  var timerDone = false, shown = false;
  function setLS(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function canShow() {
    if (shown || isStandalone()) return false;     // اتفتح من البرنامج المثبّت → ماتظهرش
    if (!isIOS()) return true;                       // أندرويد: كروم نفسه مابيبعتش الطلب لو مثبّت
    return Date.now() >= (+ls(LS_NEXT) || 0);        // آيفون مفيش طريقة نعرف: نسكت يوم بعد الرفض
  }
  function snooze() {                                // رفض: اسأله تاني بعد مدة بتزيد كل مرة
    if (isIOS()) setLS(LS_NEXT, Date.now() + 864e5);
  }
  function markInstalled() { setLS(LS_INST, '1'); deferred = null; closeCard(true); }

  function card() {
    var o = document.getElementById('gmPwaCard'); if (o) return o;
    var st = document.createElement('style');
    st.textContent =
      '#gmPwaCard{--pwa-c:#0066ff;--pwa-fg:#fff;position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(8,10,16,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;transition:opacity .45s ease;font-family:Cairo,sans-serif;direction:rtl}' +
      '#gmPwaCard.on{display:flex}#gmPwaCard.vis{opacity:1}' +
      '#gmPwaCard .box{width:100%;max-width:380px;text-align:center;padding:30px 24px 22px;border-radius:30px;background:linear-gradient(180deg,#1b1e27,#12141a);color:#fff;border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 80px rgba(0,0,0,.5);transform:translateY(24px) scale(.94);transition:transform .55s cubic-bezier(.2,.9,.25,1.1)}' +
      '#gmPwaCard.vis .box{transform:none}' +
      '#gmPwaCard .ic{width:92px;height:92px;margin:0 auto 16px;border-radius:24px;object-fit:cover;display:block;box-shadow:0 14px 34px rgba(0,0,0,.45),0 0 0 3px color-mix(in srgb,var(--pwa-c) 55%,transparent)}' +
      '#gmPwaCard h3{font-size:1.3rem;font-weight:900;margin:0 0 6px}' +
      '#gmPwaCard p{font-size:.95rem;line-height:1.6;opacity:.75;margin:0 0 20px;font-weight:600}' +
      '#gmPwaCard .nm{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom;font-weight:800;opacity:1}' +
      '#gmPwaCard button{display:block;width:100%;border:0;cursor:pointer;font:800 1rem Cairo,sans-serif;border-radius:16px;padding:14px}' +
      '#gmPwaGo{background:var(--pwa-c);color:var(--pwa-fg);box-shadow:0 10px 26px color-mix(in srgb,var(--pwa-c) 45%,transparent)}' +
      '#gmPwaGo:active{transform:scale(.98)}' +
      '#gmPwaLater{background:transparent;color:#fff;opacity:.6;margin-top:6px;font-size:.9rem!important;padding:10px!important}';
    document.head.appendChild(st);
    o = document.createElement('div'); o.id = 'gmPwaCard'; o.setAttribute('role', 'dialog'); o.setAttribute('aria-modal', 'true');
    o.innerHTML = '<div class="box"><img class="ic" alt=""><h3>ثبّت بوابتك على جهازك</h3><p><span class="nm"></span><br><span id="gmPwaSub"></span></p><button id="gmPwaGo" type="button">تثبيت الآن</button><button id="gmPwaLater" type="button">مش دلوقتي</button></div>';
    document.body.appendChild(o);
    o.addEventListener('click', function (e) { if (e.target === o) later(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && o.classList.contains('vis')) later(); });
    o.querySelector('#gmPwaLater').onclick = later;
    o.querySelector('#gmPwaGo').onclick = function () {
      if (deferred) {
        var d = deferred; deferred = null; closeCard(true);
        d.prompt();
        d.userChoice.then(function (c) { if (c && c.outcome === 'accepted') markInstalled(); else snooze(); });
      } else if (isIOS()) {
        alert('على الآيفون: اضغط زر المشاركة (⬆️) في سفاري، ثم اختار "إضافة إلى الشاشة الرئيسية".');
        closeCard(true); snooze();
      }
    };
    lastKey = ''; build();
    return o;
  }
  function paintCard() {
    var o = document.getElementById('gmPwaCard'); if (!o) return;
    var theme = (document.querySelector('meta[name="theme-color"]') || {}).content || '#0066ff';
    var r = parseInt(theme.substr(1, 2), 16), g = parseInt(theme.substr(3, 2), 16), b = parseInt(theme.substr(5, 2), 16);
    o.style.setProperty('--pwa-c', theme);
    o.style.setProperty('--pwa-fg', lum(r, g, b) > 165 ? '#12151f' : '#fff');
    var ic = document.querySelector('link[rel="icon"]'); if (ic) o.querySelector('.ic').src = ic.href;
    o.querySelector('.nm').textContent = mpInfo().gym || mpName();
    o.querySelector('#gmPwaSub').textContent = isIOS() ? 'أضفها للشاشة الرئيسية وشوف اشتراكك بضغطة' : 'اشتراكك وكارنيهك بضغطة واحدة من شاشة جهازك';
  }
  function showCard() {
    var o = card(); paintCard(); shown = true;
    o.classList.add('on');
    requestAnimationFrame(function () { requestAnimationFrame(function () { o.classList.add('vis'); }); });
  }
  function closeCard(silent) {
    var o = document.getElementById('gmPwaCard'); if (!o) return;
    o.classList.remove('vis');
    setTimeout(function () { o.classList.remove('on'); }, 450);
  }
  function later() { closeCard(); snooze(); }
  function tryShow() { if (timerDone && (mpInfo().name || mpInfo().gym) && canShow() && (deferred || isIOS())) showCard(); }

  var armed = false;
  function arm() { if (armed || !(mpInfo().name || mpInfo().gym)) return; armed = true; setTimeout(function () { timerDone = true; tryShow(); }, 1200); }
  window.addEventListener('mpinfo', function () { arm(); build(); });
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; tryShow(); });
  window.addEventListener('appinstalled', markInstalled);

  /* استدعاء يدوي من أي زرار: window.installGymApp() */
  window.installGymApp = function () { shown = false; try { localStorage.removeItem(LS_NEXT); } catch (e) {} if (deferred || isIOS()) showCard(); };

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('sw', e); }); });
  }

  build();
  document.addEventListener('DOMContentLoaded', build);
  window.addEventListener('load', build);
  setInterval(build, 2000);
})();

</script>
<script>
/* ===== أوفلاين: تسجيل السيرفس ووركر + حفظ الصفحة والخطوط ===== */
(function () {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; }).then(function () {
      if (!window.caches) return;
      var key = new Request(location.origin + location.pathname);
      caches.open('gm-member-v1').then(function (c) { return fetch(location.pathname + location.search, { cache: 'reload' }).then(function (r) { if (r && r.ok) return c.put(key, r); }); }).catch(function () {});
      var l = document.querySelector('link[href*="fonts.googleapis.com"][rel="stylesheet"]'); if (!l) return;   // نسخّن الخطوط عشان تظهر أوفلاين
      fetch(l.href).then(function (r) { return r.text(); }).then(function (css) {
        (css.match(/https:\/\/fonts\.gstatic\.com[^)'"\s]+/g) || []).slice(0, 24).forEach(function (u) { fetch(u).catch(function () {}); });
      }).catch(function () {});
    }).catch(function () {});
  });
})();
</script>
