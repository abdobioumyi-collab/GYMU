<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>بوابة المشترك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e1a;--panel:#121829;--panel2:#171e33;--line:#242d48;--gold:#f2c14e;--gold2:#c8921a;--txt:#f4f1e8;--mut:#8f99b8;--ok:#3ecf8e;--bad:#ff6b6b;--blue:#6c8cff}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Cairo',Tahoma,sans-serif;background:radial-gradient(1100px 600px at 80% -10%,#1d2850,transparent 70%),radial-gradient(800px 500px at 0% 100%,#2a1f0a55,transparent 70%),var(--bg);background-attachment:fixed;color:var(--txt);min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.num{font-family:'Montserrat','Cairo',sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:20px 18px 60px}
.narrow{max-width:440px}
h1{font-size:1.3rem;margin:6px 0 2px;font-weight:900}h2{font-size:1.05rem;margin:0 0 14px;font-weight:800}
.sub{color:var(--mut);font-size:.92rem;margin:0 0 16px;line-height:1.7}
.box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}
input,select,textarea{width:100%;padding:13px 14px;margin:0 0 10px;border-radius:12px;border:1.5px solid var(--line);background:#0c1120;color:var(--txt);font:700 16px 'Cairo',sans-serif}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold)}
label{display:block;font-size:.82rem;color:var(--mut);margin:0 2px 5px;font-weight:700}
.btn{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(180deg,#f9d25c,var(--gold2));color:#1b1403;font:900 16px 'Cairo',sans-serif;cursor:pointer}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--txt)}.btn:disabled{opacity:.55}
.msg{min-height:1.3em;color:var(--bad);font-weight:700;font-size:.92rem;text-align:center;margin:4px 0 10px;white-space:pre-line}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;font:700 .9rem 'Cairo';cursor:pointer;display:block;margin:10px auto 0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* top bar */
.bar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.bar .lg{width:44px;height:44px;border-radius:50%;background:#fff center/cover no-repeat;border:2px solid var(--gold);flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;color:#0b0f1f}
.bar b{font-size:1.05rem;flex:1}.ib{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:9px 14px;font:700 .85rem 'Cairo';cursor:pointer}

.hero::after{content:"";position:absolute;inset:-60% auto auto -10%;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(242,193,78,.2),transparent 65%);pointer-events:none}
.avatar{width:112px;height:112px;border-radius:30px;flex:none;border:3px solid var(--gold);background:#0c1120 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:2.6rem;font-weight:900;color:var(--gold);cursor:pointer;position:relative;padding:0}

.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:s 1s linear infinite;margin:30vh auto}@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
</style>

      sx = rtl ? M : W - M - sw; rr(c, sx, 550, sw, 52, 26); c.fillStyle = col + '26'; c.fill(); c.lineWidth = 2; c.strokeStyle = col; c.stroke();

  }
  function downloadCard() {

      if (/iPad|iPhone|iPod/.test(navigator.userAgent)) { var w = window.open(); if (w) w.document.write('<img src="' + url + '" style="width:100%"><p style="text-align:center;font:16px sans-serif">اضغط مطوّلاً على الصورة واختار "حفظ"</p>'); }

  // ---------- الصفحة الرئيسية ----------

  function home() {
    app.className = 'wrap';

    var frac = total && left != null ? Math.max(0, Math.min(1, left / total)) : 0, C = 2 * Math.PI * 52, col = st.k === 'ok' ? '#3ecf8e' : st.k === 'bad' ? '#ff6b6b' : '#f2c14e';

      '<div class="grid">' +
      '<div class="box s7"><img class="cardimg" id="cardImg" alt="الكارنيه"' + (cardCache.url ? ' src="' + cardCache.url + '"' : '') + '><div class="tools"><button class="btn" id="dl">⬇️ تحميل الكارنيه</button><button class="btn ghost" id="chg2">📷 غيّر صورتي</button></div><div style="margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="sub" style="margin:0">لغة الكارنيه</span><span class="seg"><button data-l="en" class="' + (cardLang === 'en' ? 'on' : '') + '">English</button><button data-l="ar" class="' + (cardLang === 'ar' ? 'on' : '') + '">عربي</button></span></div></div>' +
      '<div class="box s5"><h2>اشتراكك الحالي</h2><div class="ringbox"><div class="ring"><svg width="132" height="132" viewBox="0 0 132 132"><circle cx="66" cy="66" r="52" fill="none" stroke="#0c1120" stroke-width="12"/><circle cx="66" cy="66" r="52" fill="none" stroke="' + col + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - frac)).toFixed(1) + '"/></svg><div><b class="num" style="color:' + col + '">' + (left == null ? '—' : Math.max(0, left)) + '</b><small>يوم متبقي</small></div></div><div style="flex:1">' + kv([['من', fmt(m.start, 'ar')], ['إلى', fmt(m.end, 'ar')], total ? ['مدة الاشتراك', total + ' يوم'] : null, used != null ? ['اللي عدّى', used + ' يوم'] : null]) + '</div></div></div>' +
      (lim ? '<div class="box s6"><h2>حصصك</h2><div class="num" style="font-size:2rem;font-weight:800;color:var(--gold)">' + done + ' <small style="font-size:1rem;color:var(--mut)">/ ' + lim + ' حصة</small></div><div class="bartrack"><i style="width:' + Math.min(100, done / lim * 100) + '%"></i></div><div class="sub" style="margin:0">' + (done >= lim ? 'خلصت كل حصص الباقة.' : 'فاضل لك <b class="num">' + (lim - done) + '</b> حصة.') + '</div></div>' : '') +

      (pays.length ? '<div class="box s6"><h2>سجل مدفوعاتك</h2>' + pays.map(function (p) { return '<div class="hist"><span>' + (PAY[p.t] || 'دفعة') + '<small class="num">' + esc(p.d || '') + '</small></span><b class="num">' + esc(p.a) + ' ج</b></div>'; }).join('') + '</div>' : '') + '<div class="box s6"><h2>آخر طلباتك</h2>' + (me.requests.length ? me.requests.map(function (q) { return '<div class="hist"><span>' + (KIND[q.kind] || q.kind) + '<small>' + fmt(q.at, 'ar') + '</small></span><span class="pill ' + q.status + '">' + (ST[q.status] || q.status) + '</span></div>'; }).join('') : '<p class="sub" style="margin:0">لسه ما قدمتش أي طلب. أي تجديد أو تجميد أو شكوى هتلاقيها هنا.</p>') + '</div>' +
      ((inf.promo || inf.wa || inf.fb) ? '<div class="box s6"><h2>من الجيم</h2>' + (inf.promo ? '<p class="sub" style="color:var(--txt)">🎁 ' + esc(inf.promo) + '</p>' : '') + '<div class="tools" style="margin-top:0">' + (inf.wa ? '<a class="btn" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="' + esc(inf.wa) + '">💬 جروب الواتساب</a>' : '') + (inf.fb ? '<a class="btn ghost" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="' + esc(inf.fb) + '">صفحة الفيسبوك</a>' : '') + '</div></div>' : '') + '<div class="box s6"><h2>نصيحة النهارده</h2><div class="tip"><span>💡</span><div>' + tip + '</div></div></div>' +
      '</div>';
    document.getElementById('lo').onclick = function () { localStorage.removeItem(TK); token = null; authView(); };
    document.getElementById('rf').onclick = load; document.getElementById('chg').onclick = document.getElementById('chg2').onclick = pickPhoto; document.getElementById('dl').onclick = downloadCard;
    [].forEach.call(document.querySelectorAll('[data-l]'), function (b) { b.onclick = function () { cardLang = b.getAttribute('data-l'); try { localStorage.setItem('mp_cl', cardLang); } catch (e) {} home(); }; });
    [].forEach.call(document.querySelectorAll('[data-k]'), function (b) { b.onclick = function () { sheet(b.getAttribute('data-k')); }; });

  // ---------- تغيير الصورة مع تكبير وتحريك ----------
  function pickPhoto() {
    var f = document.createElement('input'); f.type = 'file'; f.accept = 'image/*';
    f.onchange = function () { if (!f.files[0]) return; compress(f.files[0], 1400, .9).then(cropper, function () { alert('مشكلة في الصورة، جرّب صورة تانية.'); }); };
    f.click();
  }
  function cropper(src) {
    var V = 280, ov = document.createElement('div'); ov.className = 'ov';
    ov.innerHTML = '<div class="sheet"><h1>📷 ظبّط صورتك</h1><p class="sub">اسحب الصورة بإصبعك وكبّر أو صغّر لحد ما وشّك يبان كويس جوه الإطار.</p><div class="crop" id="cr"><img id="ci" alt=""></div><div class="zoomrow"><button id="zo" aria-label="تصغير">−</button><input id="zr" type="range" min="1" max="4" step="0.01" value="1" aria-label="التكبير"><button id="zi" aria-label="تكبير">+</button></div><div class="msg" id="m"></div><button class="btn" id="sv">حفظ الصورة</button><button class="link" id="no">إلغاء</button></div>';
    document.body.appendChild(ov);
    var img = ov.querySelector('#ci'), box = ov.querySelector('#cr'), zr = ov.querySelector('#zr'), st = { x: 0, y: 0, k: 1, min: 1, w: 0, h: 0 }, pts = {}, d0 = 0, k0 = 1;
    function clamp() { st.x = Math.min(0, Math.max(V - st.w * st.k, st.x)); st.y = Math.min(0, Math.max(V - st.h * st.k, st.y)); }
    function paint() { clamp(); img.style.transform = 'translate(' + st.x + 'px,' + st.y + 'px) scale(' + st.k + ')'; zr.value = st.k / st.min; }
    function zoom(k, cx, cy) { k = Math.max(st.min, Math.min(st.min * 4, k)); var r = k / st.k; st.x = cx - (cx - st.x) * r; st.y = cy - (cy - st.y) * r; st.k = k; paint(); }
    img.onload = function () { st.w = img.naturalWidth; st.h = img.naturalHeight; st.min = st.k = Math.max(V / st.w, V / st.h); st.x = (V - st.w * st.k) / 2; st.y = (V - st.h * st.k) / 2; paint(); };
    img.src = src;
    zr.oninput = function () { zoom(st.min * parseFloat(zr.value), V / 2, V / 2); };
    ov.querySelector('#zi').onclick = function () { zoom(st.k * 1.2, V / 2, V / 2); }; ov.querySelector('#zo').onclick = function () { zoom(st.k / 1.2, V / 2, V / 2); };
    box.onwheel = function (e) { e.preventDefault(); var r = box.getBoundingClientRect(); zoom(st.k * (e.deltaY < 0 ? 1.08 : 1 / 1.08), e.clientX - r.left, e.clientY - r.top); };
    function dist() { var a = Object.keys(pts).map(function (k) { return pts[k]; }); return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); }
    box.onpointerdown = function (e) { box.setPointerCapture(e.pointerId); pts[e.pointerId] = { x: e.clientX, y: e.clientY }; if (Object.keys(pts).length === 2) { d0 = dist(); k0 = st.k; } };
    box.onpointermove = function (e) {
      var p = pts[e.pointerId]; if (!p) return; var n = Object.keys(pts).length;
      if (n === 1) { st.x += e.clientX - p.x; st.y += e.clientY - p.y; paint(); }
      pts[e.pointerId] = { x: e.clientX, y: e.clientY };
      if (n === 2 && d0) zoom(k0 * dist() / d0, V / 2, V / 2);
    };
    box.onpointerup = box.onpointercancel = function (e) { delete pts[e.pointerId]; d0 = 0; };
    ov.querySelector('#no').onclick = function () { ov.remove(); };
    var sv = ov.querySelector('#sv'), m = ov.querySelector('#m');
    sv.onclick = function () {
      sv.disabled = true; m.textContent = '';
      var c = document.createElement('canvas'); c.width = c.height = 360;
      c.getContext('2d').drawImage(img, -st.x / st.k, -st.y / st.k, V / st.k, V / st.k, 0, 0, 360, 360);
      rpc('portal_photo', { p_token: token, p_photo: c.toDataURL('image/jpeg', .82) }).then(function (r) { if (r.error) { sv.disabled = false; m.textContent = err(r); } else { ov.remove(); load(); } });
    };
  }

  function sheet(kind) {
    var ov = document.createElement('div'); ov.className = 'ov';
    var body = {
      renewal: '<h1>💳 تجديد الاشتراك</h1><p class="sub">حوّل المبلغ على رقم فودافون كاش بتاع الجيم وارفع صورة التحويل، والإدارة هتراجعه وتجدد لك.</p><label>مدة التجديد</label><select id="f1"><option>شهر</option><option>3 شهور</option><option>6 شهور</option><option>سنة</option></select><label>صورة التحويل</label><input id="f2" type="file" accept="image/*"><label>ملاحظة (اختياري)</label><input id="f3" maxlength="200">',

    }[kind];
    ov.innerHTML = '<div class="sheet">' + body + '<div class="msg" id="m"></div><button class="btn" id="ok">إرسال للإدارة</button><button class="link" id="no">إلغاء</button></div>';
    document.body.appendChild(ov);

    };
  }

  setInterval(function () { if (token && me && !document.hidden && !document.querySelector('.ov')) load(); }, 20000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && token && me && !document.querySelector('.ov')) load(); });
  if (!slug) { app.innerHTML = '<h1>الرابط ناقص</h1><p class="sub">اطلب من الجيم رابط البوابة الصحيح.</p>'; return; }
  rpc('portal_gym', { p_slug: slug }).then(function (g) {
    if (g.error) { app.innerHTML = '<h1>الجيم غير متاح</h1><p class="sub">' + esc(err(g)) + '</p>'; return; }
    gymName = g.name; gymLogo = g.logo || ''; token = localStorage.getItem(TK);
    if (token) load(); else authView();
  });
})();
