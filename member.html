<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>بوابة المشترك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f1a;--panel:#141a2b;--line:#252d45;--gold:#f2c14e;--gold2:#c8921a;--txt:#f4f1e8;--mut:#9aa3bd;--ok:#3ecf8e;--bad:#ff6b6b}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Cairo',Tahoma,sans-serif;background:radial-gradient(900px 500px at 50% -10%,#1d2644,var(--bg));color:var(--txt);min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:440px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:1.25rem;margin:6px 0 2px;font-weight:900}.sub{color:var(--mut);font-size:.9rem;margin:0 0 16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
input,select,textarea{width:100%;padding:13px 14px;margin:0 0 10px;border-radius:12px;border:1.5px solid var(--line);background:#0e1322;color:var(--txt);font:700 16px 'Cairo',sans-serif}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold)}
label{display:block;font-size:.82rem;color:var(--mut);margin:0 2px 5px;font-weight:700}
.btn{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(180deg,#f9d25c,var(--gold2));color:#1b1403;font:900 16px 'Cairo',sans-serif;cursor:pointer}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--txt)}.btn:disabled{opacity:.55}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1;padding:11px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--mut);font:800 15px 'Cairo'}
.tabs button.on{background:var(--gold);color:#1b1403;border-color:var(--gold)}
.msg{min-height:1.3em;color:var(--bad);font-weight:700;font-size:.92rem;text-align:center;margin:4px 0 10px;white-space:pre-line}.msg.ok{color:var(--ok)}

.card{position:relative;overflow:hidden;border-radius:22px;padding:20px;margin:6px 0 16px;color:#fff;background:linear-gradient(135deg,#1c2547 0%,#0d1226 55%,#2a1f06 130%);border:1.5px solid rgba(242,193,78,.55);box-shadow:0 18px 40px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.04)}
.card::before{content:"";position:absolute;inset:-40% -30% auto auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(242,193,78,.28),transparent 65%)}
.card .top{display:flex;justify-content:space-between;align-items:center;position:relative}
.card .gym{font-weight:900;color:var(--gold);letter-spacing:.3px}.card .tag{font-size:.7rem;color:var(--mut);letter-spacing:2px}
.card .who{display:flex;gap:14px;align-items:center;margin:18px 0 14px;position:relative}
.avatar{width:84px;height:84px;border-radius:50%;flex:none;border:3px solid var(--gold);background:#0e1322 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:900;color:var(--gold);cursor:pointer;position:relative}
.avatar i{position:absolute;bottom:-2px;left:-2px;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#1b1403;font-style:normal;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.card .nm{font-size:1.3rem;font-weight:900;line-height:1.3}.card .cd{color:var(--mut);font-size:.85rem;margin-top:3px}
.row{display:flex;gap:10px;position:relative}.cell{flex:1;background:rgba(255,255,255,.06);border-radius:12px;padding:9px 10px}
.cell small{display:block;color:var(--mut);font-size:.7rem}.cell b{font-size:.95rem}
.status{display:inline-block;margin-top:12px;padding:5px 14px;border-radius:30px;font-weight:900;font-size:.85rem;position:relative}
.status.ok{background:rgba(62,207,142,.15);color:var(--ok);border:1px solid var(--ok)}.status.bad{background:rgba(255,107,107,.13);color:var(--bad);border:1px solid var(--bad)}.status.warn{background:rgba(242,193,78,.14);color:var(--gold);border:1px solid var(--gold)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.act{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 8px;text-align:center;color:var(--txt);font:800 .95rem 'Cairo';cursor:pointer}
.act span{display:block;font-size:1.6rem;margin-bottom:4px}
.hist{font-size:.88rem;border-bottom:1px dashed var(--line);padding:9px 0;display:flex;justify-content:space-between;gap:8px}.hist:last-child{border:0}
.pill{padding:2px 10px;border-radius:20px;font-size:.75rem;font-weight:800;white-space:nowrap}.pill.pending{background:rgba(242,193,78,.15);color:var(--gold)}.pill.approved{background:rgba(62,207,142,.15);color:var(--ok)}.pill.rejected{background:rgba(255,107,107,.13);color:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(5,8,16,.8);display:flex;align-items:flex-end;justify-content:center;z-index:9}.sheet{background:var(--panel);width:100%;max-width:440px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0));max-height:90vh;overflow:auto}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;font:700 .9rem 'Cairo';cursor:pointer;display:block;margin:10px auto 0}
.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:s 1s linear infinite;margin:30vh auto}@keyframes s{to{transform:rotate(360deg)}}
.cardimg{display:block;width:100%;height:auto;border-radius:22px;margin:6px 0 16px;box-shadow:0 18px 40px rgba(0,0,0,.5);background:#0e1322;aspect-ratio:1012/638}
</style>

      (since != null ? '<p class="sub" style="text-align:center">بدأت فترتك الحالية من ' + since + ' يوم</p>' : '') +
      (parseFloat(m.debt) > 0 ? '<div class="box" style="border-color:var(--gold)">عليك متبقي <b style="color:var(--gold)">' + esc(m.debt) + ' ج</b></div>' : '') +
      '<div class="acts"><button class="act" data-k="renewal"><span>💳</span>تجديد الاشتراك</button><button class="act" data-k="freeze"><span>❄️</span>تجميد الاشتراك</button><button class="act" data-k="complaint"><span>📝</span>تقديم شكوى</button><button class="act" id="rf"><span>🔄</span>تحديث</button><button class="act" id="chg"><span>📷</span>غيّر صورتي</button><button class="act" id="dl"><span>⬇️</span>تحميل الكارنيه</button></div>' +
      (me.requests.length ? '<div class="box"><b>آخر طلباتك</b>' + me.requests.map(function (q) { return '<div class="hist"><span>' + KIND[q.kind] + ' · ' + fmt(q.at) + '</span><span class="pill ' + q.status + '">' + ST[q.status] + '</span></div>'; }).join('') + '</div>' : '') +
      '<button class="link" id="lo">تسجيل الخروج</button>';
    document.getElementById('lo').onclick = function () { localStorage.removeItem(TK); token = null; authView(); };
    document.getElementById('rf').onclick = load;
    document.getElementById('chg').onclick = pickPhoto;
    document.getElementById('dl').onclick = downloadCard;
    drawCard().then(function (u) { var im = document.getElementById('cardImg'); if (im && im.getAttribute('src') !== u) im.src = u; });
    [].forEach.call(document.querySelectorAll('.act[data-k]'), function (b) { b.onclick = function () { sheet(b.getAttribute('data-k')); }; });
  }

  function pickPhoto() {
    var f = document.createElement('input'); f.type = 'file'; f.accept = 'image/*';
    f.onchange = function () { if (!f.files[0]) return; compress(f.files[0], 320, .72).then(function (d) { return rpc('portal_photo', { p_token: token, p_photo: d }); }).then(function (r) { if (r.error) alert(err(r)); else load(); }); };
    f.click();
  }

  function sheet(kind) {
    var ov = document.createElement('div'); ov.className = 'ov';
    var body = {
      renewal: '<h1>💳 تجديد الاشتراك</h1><p class="sub">حوّل المبلغ على رقم فودافون كاش بتاع الجيم وارفع صورة التحويل، والإدارة هتراجعه وتجدد لك.</p><label>مدة التجديد</label><select id="f1"><option>شهر</option><option>3 شهور</option><option>6 شهور</option><option>سنة</option></select><label>صورة التحويل</label><input id="f2" type="file" accept="image/*"><label>ملاحظة (اختياري)</label><input id="f3" maxlength="200">',
      freeze: '<h1>❄️ تجميد الاشتراك</h1><p class="sub">هيتم مد تاريخ الانتهاء بنفس عدد أيام التجميد بعد موافقة الإدارة.</p><label>عدد أيام التجميد</label><select id="f1"><option>7</option><option>14</option><option>21</option><option>30</option></select><label>السبب (اختياري)</label><input id="f3" maxlength="200">',
      complaint: '<h1>📝 تقديم شكوى</h1><p class="sub">شكواك بتوصل لإدارة الجيم مباشرة.</p><textarea id="f3" rows="5" maxlength="900" placeholder="اكتب شكواك أو اقتراحك"></textarea>'
    }[kind];
    ov.innerHTML = '<div class="sheet">' + body + '<div class="msg" id="m"></div><button class="btn" id="ok">إرسال للإدارة</button><button class="link" id="no">إلغاء</button></div>';
    document.body.appendChild(ov);
    var ok = ov.querySelector('#ok'), m = ov.querySelector('#m');
    ov.querySelector('#no').onclick = function () { ov.remove(); };
    ok.onclick = function () {
      var f1 = ov.querySelector('#f1'), f2 = ov.querySelector('#f2'), f3 = ov.querySelector('#f3');
      var note = (kind === 'freeze' ? 'أيام: ' + f1.value : kind === 'renewal' ? 'مدة: ' + f1.value : '') + (f3 && f3.value.trim() ? (kind === 'complaint' ? '' : ' — ') + f3.value.trim() : '');
      if (kind === 'complaint' && !note) { m.textContent = 'اكتب الشكوى.'; return; }
      if (kind === 'renewal' && !(f2.files && f2.files[0])) { m.textContent = 'ارفع صورة التحويل.'; return; }
      ok.disabled = true; m.textContent = '';
      (kind === 'renewal' ? compress(f2.files[0], 1100, .6) : Promise.resolve('')).then(function (p) { return rpc('portal_request', { p_token: token, p_kind: kind, p_note: note, p_proof: p }); }).then(function (r) {
        if (r.ok) { ov.remove(); load(); } else { ok.disabled = false; m.textContent = err(r); }
      }, function () { ok.disabled = false; m.textContent = 'مشكلة في الصورة، جرّب صورة تانية.'; });
    };
  }

  setInterval(function () { if (token && me && !document.hidden && !document.querySelector('.ov')) load(); }, 20000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && token && me) load(); });
  if (!slug) { app.innerHTML = '<h1>الرابط ناقص</h1><p class="sub">اطلب من الجيم رابط البوابة الصحيح.</p>'; return; }
  rpc('portal_gym', { p_slug: slug }).then(function (g) {
    if (g.error) { app.innerHTML = '<h1>الجيم غير متاح</h1><p class="sub">' + esc(err(g)) + '</p>'; return; }
    gymName = g.name; gymLogo = g.logo || ''; token = localStorage.getItem(TK);
    if (token) load(); else authView();
  });
})();
</script>
</body>
</html>
